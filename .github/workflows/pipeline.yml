# =============================================================================
# Tourism Project - end-to-end MLOps pipeline (CI/CD with GitHub Actions)
#
#   register-dataset  ->  data-prep  ->  model-training  ->  commit model to main
#                                                              |
#                                     Streamlit Community Cloud redeploys the app
#
# Each job runs on a fresh Ubuntu runner. Files are handed from one job to the
# next as WORKFLOW ARTIFACTS (dataset -> train/test splits). The final job
# commits the trained model back to the main branch.
# =============================================================================
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main            # run automatically on every push to main
  workflow_dispatch:    # also allow a manual "Run workflow" button

# The workflow needs write access to push the trained model back to the repo
permissions:
  contents: write

# If several pushes arrive quickly, only the newest run continues.
# This prevents two runs from committing models at the same time.
concurrency:
  group: tourism-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: validate and register the dataset stored in the repository
  # ---------------------------------------------------------------------------
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------------------------------------------------------------------------
  # JOB 2: clean the data, split into train / test, publish the splits
  # ---------------------------------------------------------------------------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ---------------------------------------------------------------------------
  # JOB 3: tune + train the model with MLflow tracking, commit the best model
  # ---------------------------------------------------------------------------
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &  # run MLflow UI in the background
          sleep 10  # give the server time to start

      - name: Model Building
        run: python tourism_project/model_building/train.py

      - name: Upload MLflow Runs and Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlruns/
            mlartifacts/
            mlflow.db
            feature_importances.csv
            tourism_project/deployment/model_metrics.json
          if-no-files-found: ignore

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model_v1.joblib tourism_project/deployment/model_metrics.json
          # [skip ci] stops this commit from triggering the pipeline again (no infinite loop)
          git commit -m "Add trained model from run ${{ github.run_number }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main   # pick up any commits pushed meanwhile
          git push origin HEAD:main
